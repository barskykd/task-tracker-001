[project]
name = "task-tracker"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=48.0.0",
    "django>=6.0.6",
    "django-allauth>=65.18.0",
    "django-tailwind>=4.4.2",
    "djangorestframework>=3.17.1",
    "drf-spectacular>=0.29.0",
    "gunicorn>=26.0.0",
    "markdown>=3.10.2",
    "pyjwt>=2.13.0",
    "pytest>=9.0.3",
    "pytest-django>=4.12.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "cookiecutter>=2.7.1",
]
